name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Backup .env
        run: |
          mkdir -p /tmp/env_backup
          if [ -f Backend/.env ]; then
            cp Backend/.env /tmp/env_backup/.env
          fi

      - uses: actions/checkout@v4

      - name: Restore .env
        run: |
          if [ -f /tmp/env_backup/.env ]; then
            cp /tmp/env_backup/.env Backend/.env
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm install

      - name: Restart PM2
        working-directory: Backend
        run: |
          pm2 restart interviewos-backend --update-env || pm2 start app.js --name interviewos-backend
