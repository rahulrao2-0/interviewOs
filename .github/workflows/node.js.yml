name: Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: ./Forntend

      - name: Build Frontend
        run: npm run build
        working-directory: ./Forntend

      # SSH STEP (clean old build)
      - name: Clean old dist on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            rm -rf /home/ubuntu/frontend/Forntend/dist

      # SCP DEPLOY STEP
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_KEY }}
          source: "Forntend/dist/*"
          target: "/home/ubuntu/frontend/Forntend/dist"
          overwrite: true
