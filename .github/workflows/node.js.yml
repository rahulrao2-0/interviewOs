name: Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Forntend/package-lock.json

      - name: Install Dependencies
        working-directory: Forntend
        run: npm install

      - name: Build Frontend
        working-directory: Forntend
        run: npm run build

      - name: Deploy Build Files
        run: |
          sudo rm -rf /var/www/html/*
          sudo cp -r Forntend/dist/* /var/www/html/

      - name: Reload Nginx
        run: sudo systemctl reload nginx
